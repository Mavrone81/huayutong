<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MandaMix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="1" stop-color="#0E2235"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="0" y="0" width="512" height="256" rx="116" fill="#FFFFFF" opacity="0.05"/>
  <!-- 华 (huá) — the brand mark, in the app's hanzi serif -->
  <text x="50%" y="53%" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif CJK SC','Noto Serif SC',serif" font-weight="900"
        font-size="320" fill="#FFFFFF">华</text>
  <!-- gold accent dot -->
  <circle cx="402" cy="120" r="34" fill="#E9A23B"/>
</svg>
