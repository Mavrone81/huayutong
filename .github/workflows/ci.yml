name: CI

# Verifies the web app typechecks and builds before code reaches prod.
# Prod deploys via a server-side cron that pulls origin/main (see deploy/DEPLOY.md),
# so this gate is the only automated check between a PR and production.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck & build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mandamix
          POSTGRES_PASSWORD: mandamix
          POSTGRES_DB: mandamix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandamix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: mandamix
      DATABASE_URL: postgresql://mandamix:mandamix@localhost:5432/mandamix_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load schema, seeds & migrations
        run: |
          psql -h localhost -U mandamix -d mandamix_test -v ON_ERROR_STOP=1 -f ../db/schema.sql
          psql -h localhost -U mandamix -d mandamix_test -v ON_ERROR_STOP=1 -f ../db/seed.sql
          for m in ../db/migrations/*.sql; do
            psql -h localhost -U mandamix -d mandamix_test -v ON_ERROR_STOP=1 -f "$m"
          done

      - name: Test
        run: npm test
